# Weekly dependency updates (#59). Both ecosystems in use are covered: the npm
# tree, and the actions pinned in .github/workflows.
#
# Deliberately NO `target-branch` here. `main` is the repository default branch,
# so Dependabot already raises PRs against it — which is exactly where they belong
# under the promotion flow in CLAUDE.md (feature -> main -> master).
#
# Setting target-branch would be actively harmful: it makes a config
# VERSION-UPDATES ONLY. Dependabot *security* updates always target the default
# branch and cannot be retargeted, so pinning it here would mean a critical CVE
# never opens a security PR — it would only be picked up whenever the weekly
# version run happened to bump past it.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Next, React and their type packages move together; separate PRs for each
      # would land a half-upgraded tree that fails to build.
      next-react:
        patterns:
          - next
          - react
          - react-dom
          - eslint-config-next
          - "@types/react"
          - "@types/react-dom"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
